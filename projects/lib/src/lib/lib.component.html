<dialog class="icon-picker" #dialogPopup
     [id]="dialogId"
     [open]="show"
     [attr.aria-label]="ipPlaceHolder"
     [hidden]="!show"
     [style.visibility]="hidden ? 'hidden' : 'visible'"
     [style.height.px]="ipHeight"
     [style.width.px]="ipWidth"
     [style.top.px]="top"
     [style.left.px]="left"
     [style.position]="position">
  <div class="arrow arrow-{{ipPosition}}" [style.top.px]="arrowTop" aria-hidden="true"></div>
  <div class="icon-search {{ipDivSearchStyleClass}}">
    <input #searchInput type="search" class="{{ipInputSearchStyleClass}}"
           [id]="dialogId + '-search'"
           [attr.aria-label]="ipPlaceHolder"
           [value]="search"
           [placeholder]="ipPlaceHolder"
           (input)="setSearch(searchInput.value)" />
  </div>
  @let filteredIcons = icons | search:search;
  <div #iconGrid class="icon-grid" [style.max-height.px]="ipMaxHeight"
       (scroll)="onGridScroll(iconGrid, filteredIcons.length)">
    @for (icon of filteredIcons | slice:0:renderedIconCount; track icon) {
      <div>
        <button class="ip-button-icon {{ipButtonStyleClass}}" type="button" [title]="icon"
                [attr.aria-label]="icon"
                [attr.aria-pressed]="icon === selectedIcon"
                [class.active]="icon === selectedIcon"
                [style.width.px]="buttonWidth"
                [style.height.px]="buttonHeight"
                [style.padding-top.px]="ipIconVerticalPadding"
                [style.padding-bottom.px]="ipIconVerticalPadding"
                [style.padding-left.px]="ipIconHorizontalPadding"
                [style.padding-right.px]="ipIconHorizontalPadding"
                (click)="selectIcon(icon)"
                (focus)="onIconFocus($index, filteredIcons.length)">
          <span class="bi bi-{{icon}}" [style.font-size.px]="ipIconSize" aria-hidden="true"></span>
        </button>
      </div>
    }
  </div>
</dialog>
